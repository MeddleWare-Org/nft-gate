[package]
name = "nft-gate-gateway"
version = "0.0.2"
edition = "2021"
license = "0BSD"
description = "Generic NFT-gated reverse-proxy: verifies wallet-signed access proofs against on-chain NFT ownership, then forwards to any upstream."
repository = "https://github.com/meddleware-org/nft-gate"
homepage = "https://github.com/meddleware-org/nft-gate"
documentation = "https://github.com/meddleware-org/nft-gate/tree/main/gateway-rust"
readme = "README.md"
keywords = ["nft", "sui", "gateway", "access-control", "reverse-proxy"]
categories = ["network-programming", "web-programming::http-server", "authentication"]

[[bin]]
name = "nft-gate-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# HTTP client: hyper 1.x + hyper-rustls instead of reqwest to avoid the
# url → idna → icu_normalizer compile chain (~10 min on GHA).
bytes = "1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", features = ["webpki-tokio", "http1"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
blake2 = "0.10"
ed25519-dalek = "2"
# secp256k1 / secp256r1 personal-message signature verification (Sui flags 0x01 / 0x02).
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
# OsRng for nonce generation — much lighter than the full rand crate (no algorithms needed).
rand_core = { version = "0.6", features = ["getrandom"] }
# Shared TTL nonce store for horizontal scale-out (Redis protocol; works with Dragonfly).
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
