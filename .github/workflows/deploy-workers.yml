name: Deploy Workers

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Wrangler deploy (gateway-workers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
