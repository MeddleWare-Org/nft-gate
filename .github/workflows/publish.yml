name: Publish

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: nft-gate-gateway

jobs:
  # ── Rust gateway: Docker image (primary deployment artifact) ────────────────
  publish-docker-public:
    name: Docker (quay.io + Docker Hub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to quay.io
        uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: gateway-rust
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: echo "Published & signed @ ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-docker-private:
    name: Docker (self-hosted registry)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to self-hosted registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ vars.PRIVATE_REGISTRY }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.PRIVATE_REGISTRY }}/${{ vars.PRIVATE_NAMESPACE }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: gateway-rust
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Rust gateway: crates.io (cargo install distribution) ───────────────────
  publish-crates:
    name: crates.io (gateway-rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-rust
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gateway-rust -> target"

      - name: Check if already published
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: github-actions/nft-gate" \
            "https://crates.io/api/v1/crates/nft-gate-gateway/$VERSION")
          if [ "$HTTP" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already on crates.io — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.skip == 'false'
        run: cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Workers gateway: npmjs (source-distribution for forkers) ───────────────
  # Uses OIDC trusted publisher — no static NPM_TOKEN secret required.
  # Configure this package as a trusted publisher on npmjs.com before enabling
  # the automated path. Until then, publish manually before pushing the tag and
  # the version-check will skip this step cleanly.
  publish-npm:
    name: npmjs (@meddleware/nft-gate-gateway)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publisher exchange
    defaults:
      run:
        working-directory: gateway-workers
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npmjs (provenance via OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://registry.npmjs.org/@meddleware%2fnft-gate-gateway/${VERSION}")
          if [ "$HTTP" = "200" ]; then
            echo "::notice::v${VERSION} already published to npmjs — skipping"
          else
            npm publish --provenance
          fi
